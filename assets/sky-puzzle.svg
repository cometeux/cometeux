<svg xmlns="http://www.w3.org/2000/svg" width="740" height="265" viewBox="0 0 740 265" role="img" aria-labelledby="title desc"><title id="title">Two skies. One small change.</title><desc id="desc">Two invented star maps with six numbered stars each. Compare the location of star 4. This is a visual puzzle, not a map of real stars.</desc><rect width="740" height="265" rx="18" fill="#0c1623"/><g transform="translate(25 55)"><text x="5" y="-15" fill="#91a7ba" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">EARLIER</text><rect width="330" height="185" rx="14" fill="#101e2d" stroke="#35465a"/><g transform="translate(45 65)"><path d="M-6 0H6M0-6V6" stroke="#d8e9f1" stroke-width="1.5"/><circle r="2.3" fill="#f2dfbd"/><text x="9" y="-8" fill="#a9bfd0" font-family="Arial,sans-serif" font-size="12">1</text></g><g transform="translate(95 120)"><path d="M-6 0H6M0-6V6" stroke="#d8e9f1" stroke-width="1.5"/><circle r="2.3" fill="#f2dfbd"/><text x="9" y="-8" fill="#a9bfd0" font-family="Arial,sans-serif" font-size="12">2</text></g><g transform="translate(150 55)"><path d="M-6 0H6M0-6V6" stroke="#d8e9f1" stroke-width="1.5"/><circle r="2.3" fill="#f2dfbd"/><text x="9" y="-8" fill="#a9bfd0" font-family="Arial,sans-serif" font-size="12">3</text></g><g transform="translate(195 135)"><path d="M-6 0H6M0-6V6" stroke="#d8e9f1" stroke-width="1.5"/><circle r="2.3" fill="#f2dfbd"/><text x="9" y="-8" fill="#a9bfd0" font-family="Arial,sans-serif" font-size="12">4</text></g><g transform="translate(245 85)"><path d="M-6 0H6M0-6V6" stroke="#d8e9f1" stroke-width="1.5"/><circle r="2.3" fill="#f2dfbd"/><text x="9" y="-8" fill="#a9bfd0" font-family="Arial,sans-serif" font-size="12">5</text></g><g transform="translate(295 145)"><path d="M-6 0H6M0-6V6" stroke="#d8e9f1" stroke-width="1.5"/><circle r="2.3" fill="#f2dfbd"/><text x="9" y="-8" fill="#a9bfd0" font-family="Arial,sans-serif" font-size="12">6</text></g></g><g transform="translate(385 55)"><text x="5" y="-15" fill="#91a7ba" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">LATER</text><rect width="330" height="185" rx="14" fill="#101e2d" stroke="#35465a"/><g transform="translate(45 65)"><path d="M-6 0H6M0-6V6" stroke="#d8e9f1" stroke-width="1.5"/><circle r="2.3" fill="#f2dfbd"/><text x="9" y="-8" fill="#a9bfd0" font-family="Arial,sans-serif" font-size="12">1</text></g><g transform="translate(95 120)"><path d="M-6 0H6M0-6V6" stroke="#d8e9f1" stroke-width="1.5"/><circle r="2.3" fill="#f2dfbd"/><text x="9" y="-8" fill="#a9bfd0" font-family="Arial,sans-serif" font-size="12">2</text></g><g transform="translate(150 55)"><path d="M-6 0H6M0-6V6" stroke="#d8e9f1" stroke-width="1.5"/><circle r="2.3" fill="#f2dfbd"/><text x="9" y="-8" fill="#a9bfd0" font-family="Arial,sans-serif" font-size="12">3</text></g><g transform="translate(195 90)"><path d="M-6 0H6M0-6V6" stroke="#d8e9f1" stroke-width="1.5"/><circle r="2.3" fill="#f2dfbd"/><text x="9" y="-8" fill="#a9bfd0" font-family="Arial,sans-serif" font-size="12">4</text></g><g transform="translate(245 85)"><path d="M-6 0H6M0-6V6" stroke="#d8e9f1" stroke-width="1.5"/><circle r="2.3" fill="#f2dfbd"/><text x="9" y="-8" fill="#a9bfd0" font-family="Arial,sans-serif" font-size="12">5</text></g><g transform="translate(295 145)"><path d="M-6 0H6M0-6V6" stroke="#d8e9f1" stroke-width="1.5"/><circle r="2.3" fill="#f2dfbd"/><text x="9" y="-8" fill="#a9bfd0" font-family="Arial,sans-serif" font-size="12">6</text></g></g><text x="370" y="255" text-anchor="middle" fill="#8ca3b8" font-family="Arial,sans-serif" font-size="11">An invented sky. A small reason to look twice.</text></svg>