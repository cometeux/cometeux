<title id="title">After hours — astronomy, story-driven games, cats and black coffee</title><desc id="desc">A hand-drawn night scene: a ringed planet, a controller, a steaming cup and a cat that occasionally blinks. Motion respects reduced-motion preferences.</desc>
<style>.blink{transform-box:fill-box;transform-origin:center;animation:blink 9s infinite}.steam{animation:steam 5s ease-in-out infinite}.star{animation:twinkle 7s ease-in-out infinite}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}@keyframes steam{0%,100%{opacity:.3;transform:translateY(2px)}50%{opacity:.8;transform:translateY(-6px)}}@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.blink,.steam,.star{animation:none}}</style>
<rect width="1200" height="320" rx="0" fill="#080a10"/>
<text x="44" y="47" fill="#a9c5db" font-family="monospace" font-size="15" letter-spacing="3">AFTER HOURS</text>
<text x="42" y="99" fill="#edf1f3" font-family="Georgia,serif" font-size="36">A few things that feel like me.</text>
<text x="44" y="138" fill="#b1c6d7" font-family="Arial,sans-serif" font-size="19">Night skies. Good stories. Cats. Black coffee.</text>
