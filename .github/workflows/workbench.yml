name: Refresh public workbench
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update_workbench.py
      - .github/workflows/workbench.yml
permissions:
  contents: write
concurrency:
  group: public-workbench
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public updates and render SVG
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_workbench.py
      - name: Commit only actual changes
        run: |
          if git diff --quiet -- assets/workbench.svg; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/workbench.svg
          git commit -m 'Refresh public workbench updates'
          git push
