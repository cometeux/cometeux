name: Voice intent regression checks
on:
  push:
    paths: ['playground/voice-intent-core/**', '.github/workflows/voice-intent-core.yml']
  pull_request:
    paths: ['playground/voice-intent-core/**', '.github/workflows/voice-intent-core.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground/voice-intent-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
